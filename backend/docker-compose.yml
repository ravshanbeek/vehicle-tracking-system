version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cartracking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cartracking
      POSTGRES_USER: cartracking
      POSTGRES_PASSWORD: cartracking_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartracking -d cartracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartracking_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=cartracking;Username=cartracking;Password=cartracking_pass"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
